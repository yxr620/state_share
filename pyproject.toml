[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gdn-beam"
version = "0.1.0"
description = "Shared-state Gated DeltaNet decoding for beam search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
cuda = ["triton>=3.0"]
qwen = ["triton>=3.0", "transformers==5.12.1"]

[tool.setuptools]
packages = ["gdn_beam"]
